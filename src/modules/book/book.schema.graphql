type Booking {
  id: Int!
  start_date: String!
  end_date: String!
  hotel_id: Int!
  is_checked_in: Boolean!
  price: Float!
}

type Query {
  bookings: [Booking!]!
  bookingsByDateRange(start_date: String!, end_date: String!): [Booking!]!
}

type Mutation {
  bookHotel(start_date: String!, end_date: String!, hotel_id: Int!, price: Float!): Booking!
  cancelBooking(id: Int!): Boolean!
  checkIn(id: Int!): Booking
}
